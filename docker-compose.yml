services:
  cassandra:
    image: cassandra:4.1
    container_name: shop-cassandra
    ports: ["9042:9042"]
    environment:
      - CASSANDRA_CLUSTER_NAME=ShopCluster
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes: [cassandra_data:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
  mongo:
    image: mongo:7
    container_name: shop-mongo
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
volumes:
  cassandra_data:
  mongo_data:
